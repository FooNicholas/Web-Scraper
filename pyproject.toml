[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scraperbot"
version = "0.1.0"
description = "A Cardfight!! Vanguard price-comparison Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=21.10,<22",
  "rapidfuzz>=3.10,<4",
  "selenium>=4.50,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "playwright>=1.51,<2",
]
packaging = [
  "pyinstaller>=6.12,<7",
]

[project.scripts]
scraperbot = "scraperbot.main:run"
scraperbot-web = "scraperbot.web:main"
scraperbot-desktop = "scraperbot.desktop:main"
scraperbot-build-catalogue-snapshot = "scraperbot.catalogue_snapshot:main"
scraperbot-import = "scraperbot.catalogue.importer:main"
scraperbot-import-official = "scraperbot.catalogue.official_importer:main"
scraperbot-import-japanese = "scraperbot.catalogue.japanese_importer:main"
scraperbot-import-official-promos = "scraperbot.catalogue.official_promos:main"
scraperbot-link-official-japanese = "scraperbot.catalogue.official_japanese_linker:main"
scraperbot-map-fandom = "scraperbot.catalogue.fandom_importer:main"
scraperbot-map-cross-prints = "scraperbot.catalogue.cross_print_importer:main"
scraperbot-derive-japanese-names = "scraperbot.catalogue.japanese_name_deriver:main"
scraperbot-repair-promo-mappings = "scraperbot.catalogue.promo_mapping_repair:main"
scraperbot-repair-regional-mappings = "scraperbot.catalogue.regional_mapping_repair:main"
scraperbot-repair-reprint-mappings = "scraperbot.catalogue.english_reference_mapping_repair:main"
scraperbot-repair-english-reference-mappings = "scraperbot.catalogue.english_reference_mapping_repair:main"
scraperbot-import-yuyutei-promos = "scraperbot.catalogue.promo_catalogue_importer:main"
scraperbot-promo-review = "scraperbot.catalogue.promo_review:main"
scraperbot-catalogue-status = "scraperbot.catalogue.status:main"
scraperbot-refresh-catalogue = "scraperbot.catalogue.refresh:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scraperbot*"]
